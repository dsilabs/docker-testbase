
image: docker:stable

variables:
  IMAGE_NAME: dsilabs/testbase

stages:
  - build

build 3.9:
  stage: build
  variables:
    PYTHON_VERSION: "3.9"
    TAG_NAME: "3.9-latest"
  script:
    - docker build --no-cache -t ${IMAGE_NAME}:${TAG_NAME} .
    - docker run --rm ${IMAGE_NAME}:${TAG_NAME} echo "Hello World" | grep -q "Hello World"
    - docker run --rm testbase:3.12-latest bash -c "google-chrome --version" | grep -q "Google Chrome"
    - docker run --rm testbase:3.12-latest bash -c "mysql --version" | grep -q "MariaDB"
