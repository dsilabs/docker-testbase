
image: docker:stable

variables:
  IMAGE_NAME: dsilabs/testbase

stages:
  - build
  - publish
  - mirror

# Template for build jobs
.build_template: &build_definition
  stage: build
  before_script:
    - apk add --no-cache bash grep  # Ensure bash and grep are available
  script:
    - echo "Building ${IMAGE_NAME}:${PYTHON_VERSION} with Python ${PYTHON_VERSION}"
    - docker build --build-arg PYTHON_VERSION=${PYTHON_VERSION} -t ${IMAGE_NAME}:${PYTHON_VERSION} .
    - echo "Running tests..."
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} echo "Hello World" | grep "Hello World" || { echo "Echo test failed"; exit 1; }
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} bash -c "google-chrome --version" | grep "Google Chrome" || { echo "Chrome test failed"; exit 1; }
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} bash -c "mysql --version" | grep "MariaDB" || { echo "MariaDB test failed"; exit 1; }
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} python --version | grep "Python ${PYTHON_VERSION}" || { echo "Python test failed"; exit 1; }
    - echo "Tests passed!"

# Template for publish jobs
.publish_template: &publish_definition
  stage: publish
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    - echo "Building ${IMAGE_NAME}:${PYTHON_VERSION} with Python ${PYTHON_VERSION}"
    - docker build --build-arg PYTHON_VERSION=${PYTHON_VERSION} -t ${IMAGE_NAME}:${PYTHON_VERSION} .
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} python --version | grep "Python ${PYTHON_VERSION}" || { echo "Python test failed"; exit 1; }
    - echo "Pushing ${IMAGE_NAME}:${PYTHON_VERSION} with Python ${PYTHON_VERSION}"
    - docker push ${IMAGE_NAME}:${PYTHON_VERSION}
    - docker image rm ${IMAGE_NAME}:${PYTHON_VERSION}  # Clean up
    - echo "Pushed successfully!"
  only:
    - master

# Specific jobs
build 3.7:
  <<: *build_definition
  variables:
    PYTHON_VERSION: "3.7"

publish 3.7:
  <<: *publish_definition
  variables:
    PYTHON_VERSION: "3.7"

build 3.8:
  <<: *build_definition
  variables:
    PYTHON_VERSION: "3.8"

publish 3.8:
  <<: *publish_definition
  variables:
    PYTHON_VERSION: "3.8"

build 3.9:
  <<: *build_definition
  variables:
    PYTHON_VERSION: "3.9"

publish 3.9:
  <<: *publish_definition
  variables:
    PYTHON_VERSION: "3.9"

build 3.12:
  <<: *build_definition
  variables:
