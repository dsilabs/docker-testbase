  variables:
    PYTHON_VERSION: "3.13"

mirror_to_github:
  stage: mirror
  image: alpine:latest

  before_script:

    - apk add --no-cache git openssh

    - mkdir -p ~/.ssh
    - echo "$DEPLOY_USER_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host github.com\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

  script:

    - git clone --bare "$CI_REPOSITORY_URL" repo
    - cd repo

    - git remote add github git@github.com:dsilabs/docker-testbase.git
    - git push github

  only:
    - master
