
image: docker:stable

variables:
  IMAGE_NAME: dsilabs/testbase

stages:
  - build

build 3.9:
  stage: build
  variables:
    PYTHON_VERSION: "3.9"
    TAG_NAME: "3.9-latest"
  script:
    - docker build --build-arg PYTHON_VERSION=${PYTHON_VERSION} --no-cache -t ${IMAGE_NAME}:${TAG_NAME} .
    - docker run --rm ${IMAGE_NAME}:${TAG_NAME} echo "Hello World" | grep -q "Hello World"
    - docker run --rm ${IMAGE_NAME}:${TAG_NAME} bash -c "google-chrome --version" | grep -q "Google Chrome"
    - docker run --rm ${IMAGE_NAME}:${TAG_NAME} bash -c "mysql --version" | grep -q "MariaDB"
    - docker run --rm ${IMAGE_NAME}:${TAG_NAME} bash -c "nginx -version" | grep -q "nginx"
    - docker run --rm ${IMAGE_NAME}:${TAG_NAME} bash -c "uwsgi" | grep -q "uWSGI"
