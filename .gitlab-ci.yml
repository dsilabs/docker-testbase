
image: docker:29-cli

variables:
  IMAGE_NAME: dsilabs/testbase

# Docker Hub occasionally returns 500 while resolving the base image.
# Retry that, and only that. A real Dockerfile error still fails immediately.
.retry_docker_build: &retry_docker_build |
  n=0
  while true; do
    if docker build --build-arg PYTHON_VERSION="${PYTHON_VERSION}" -t "${IMAGE_NAME}:${PYTHON_VERSION}" . > /tmp/docker-build.log 2>&1; then
      cat /tmp/docker-build.log
      break
    fi
    cat /tmp/docker-build.log
    if ! grep -E -q '500 Internal Server Error|429 Too Many Requests|toomanyrequests|TLS handshake timeout|i/o timeout|connection reset by peer|unexpected EOF' /tmp/docker-build.log; then
      echo "docker build failed"
      exit 1
    fi
    n=$((n + 1))
    if [ "$n" -ge 4 ]; then
      echo "docker build failed after ${n} registry retries"
      exit 1
    fi
    echo "Docker Hub error resolving python:${PYTHON_VERSION}, retry ${n} in $((n * 15))s"
    sleep $((n * 15))
  done

stages:
  - build
  - publish
  - mirror

# Template for build jobs
.build_template: &build_definition
  stage: build
  before_script:
    - apk add --no-cache bash grep  # Ensure bash and grep are available
  script:
    - echo "Building ${IMAGE_NAME}:${PYTHON_VERSION} with Python ${PYTHON_VERSION}"
    - *retry_docker_build
    - echo "Running tests..."
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} echo "Hello World" | grep "Hello World" || { echo "Echo test failed"; exit 1; }
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} bash -c "google-chrome --version" | grep "Google Chrome" || { echo "Chrome test failed"; exit 1; }
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} bash -c "mysql --version" | grep "MariaDB" || { echo "MariaDB test failed"; exit 1; }
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} python --version | grep "Python ${PYTHON_VERSION}" || { echo "Python test failed"; exit 1; }
    - docker run --rm -i -e EXPECTED_PYTHON="${PYTHON_VERSION}" ${IMAGE_NAME}:${PYTHON_VERSION} bash -s < scripts/uwsgi-smoke.sh || { echo "uWSGI smoke test failed"; exit 1; }
    - echo "Tests passed!"

# Template for publish jobs
.publish_template: &publish_definition
  stage: publish
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    - echo "Building ${IMAGE_NAME}:${PYTHON_VERSION} with Python ${PYTHON_VERSION}"
    - *retry_docker_build
    - docker run --rm ${IMAGE_NAME}:${PYTHON_VERSION} python --version | grep "Python ${PYTHON_VERSION}" || { echo "Python test failed"; exit 1; }
    - docker run --rm -i -e EXPECTED_PYTHON="${PYTHON_VERSION}" ${IMAGE_NAME}:${PYTHON_VERSION} bash -s < scripts/uwsgi-smoke.sh || { echo "uWSGI smoke test failed"; exit 1; }
    - echo "Pushing ${IMAGE_NAME}:${PYTHON_VERSION} with Python ${PYTHON_VERSION}"
    - docker push ${IMAGE_NAME}:${PYTHON_VERSION}
    - docker image rm ${IMAGE_NAME}:${PYTHON_VERSION}  # Clean up
    - echo "Pushed successfully!"
  only:
    - master

# Specific jobs
build 3.7:
  <<: *build_definition
  variables:
    PYTHON_VERSION: "3.7"

publish 3.7:
  <<: *publish_definition
  variables:
    PYTHON_VERSION: "3.7"

